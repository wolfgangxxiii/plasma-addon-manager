[package]
name = "plasma-addon-helper"
version = "0.4.4"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Distribution-aware KDE add-on manager with verified updater installation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
anyhow = "1"
toml = "0.9"
toml_edit = "0.23"
fs2 = "0.4"

[lib]
name = "plasma_addon_helper"
path = "src/lib.rs"

[[bin]]
name = "plasma-addon-helper"
path = "src/main.rs"

[[bin]]
name = "plasma-addon-manager-agent"
path = "src/bin/plasma-addon-manager-agent.rs"
