[package]
name = "plasma-addon-helper"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Distribution-aware KDE add-on manager with verified updater installation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[lib]
name = "plasma_addon_helper"
path = "src/lib.rs"

[[bin]]
name = "plasma-addon-helper"
path = "src/main.rs"
