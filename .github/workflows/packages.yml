name: Build preview packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deb:
    name: Debian 13 DEB
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl cmake ninja-build g++ git file \
            rustc cargo dpkg-dev \
            extra-cmake-modules qt6-base-dev qt6-declarative-dev \
            libkirigami-dev libkf6qqc2desktopstyle-dev \
            qml6-module-org-kde-kirigami qml6-module-org-kde-desktop \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts
      - name: Build and inspect DEB
        run: bash scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plasma-addon-manager-0.1.0-deb
          path: dist/*.deb
          if-no-files-found: error

  appimage:
    name: Qt6 AppImage
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl cmake ninja-build g++ git \
            rustc cargo patchelf file binutils \
            extra-cmake-modules qt6-base-dev qt6-declarative-dev \
            qt6-wayland qt6-base-dev-tools \
            libkirigami-dev libkf6qqc2desktopstyle-dev \
            qml6-module-org-kde-kirigami qml6-module-org-kde-desktop \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts
      - name: Build and checksum AppImage
        run: bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plasma-addon-manager-0.1.0-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  flatpak:
    name: KDE Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
      - name: Build and checksum Flatpak
        run: bash scripts/build-flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plasma-addon-manager-0.1.0-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  preview-release:
    name: Publish preview download files
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deb, appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plasma-addon-manager-0.1.0-*
          path: dist
          merge-multiple: true
      - name: Verify all package files exist
        run: |
          test -s dist/plasma-addon-manager_0.1.0_amd64.deb
          test -s dist/Plasma-Addon-Manager-v0.1.0-x86_64.AppImage
          test -s dist/Plasma-Addon-Manager-v0.1.0-x86_64.flatpak
          sha256sum dist/*
      - name: Publish v0.1.0 preview to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-preview.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Preview release already exists; leaving the published files unchanged.'
          else
            gh release create v0.1.0-preview.1 dist/*.deb dist/*.AppImage dist/*.flatpak \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'Plasma Addon Manager v0.1.0 preview' \
              --notes 'Testowe pakiety x86_64 dla KDE Plasma: DEB (Debian 13), AppImage i Flatpak. Wersja 0.1.0 oferuje tylko diagnostykę/odczyt; nie instaluje jeszcze aktualizacji dodatków. Flatpak ma ograniczony dostęp do hosta. Nie jest to stabilne wydanie produkcyjne.'
          fi
