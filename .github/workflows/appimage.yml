name: Build and release AppImage

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  appimage:
    name: KDE Plasma AppImage x86_64
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6, Kirigami and build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl cmake ninja-build g++ git gh weston \
            rustc cargo patchelf file binutils \
            extra-cmake-modules qt6-base-dev qt6-declarative-dev \
            qt6-wayland qt6-base-dev-tools \
            libkirigami-dev libkf6qqc2desktopstyle-dev \
            qml6-module-org-kde-kirigami qml6-module-org-kde-desktop \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts
      - name: Build and smoke-test AppImage
        run: |
          cargo test --manifest-path backend/Cargo.toml
          bash scripts/build-appimage.sh
      - name: Test AppImage in a headless Wayland session
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --socket=pam-wayland --idle-time=0 --no-config \
            >"$XDG_RUNTIME_DIR/weston.log" 2>&1 &
          pam_weston_pid=$!
          trap 'kill "$pam_weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            test -S "$XDG_RUNTIME_DIR/pam-wayland" && break
            sleep 0.25
          done
          test -S "$XDG_RUNTIME_DIR/pam-wayland" || {
            cat "$XDG_RUNTIME_DIR/weston.log"
            exit 1
          }
          WAYLAND_DISPLAY=pam-wayland QT_QPA_PLATFORM=wayland QT_QUICK_BACKEND=software \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            dist/Plasma-Addon-Manager-v0.3.0-x86_64.AppImage --self-test
      - name: Verify binary and checksum
        run: |
          test -s dist/Plasma-Addon-Manager-v0.3.0-x86_64.AppImage
          sha256sum dist/Plasma-Addon-Manager-v0.3.0-x86_64.AppImage
      - name: Publish AppImage directly in Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.3.0-appimage-preview.1
          appimage=dist/Plasma-Addon-Manager-v0.3.0-x86_64.AppImage
          test -s "$appimage"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Preview already published; leaving the existing download unchanged.'
          else
            gh release create "$tag" "$appimage" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'Plasma Addon Manager 0.3.0 — automatyzacja KDE Store' \
              --notes 'AppImage x86_64 dla KDE Plasma 6. Dodano agenta systemd --user z harmonogramem 6/12/24 h, ustawieniami wykluczeń, powiadomieniami, możliwością naprawy i ręcznego uruchomienia. Bezpieczna migracja starszych harmonogramów z repozytoriów Bazzite/Debian wymaga wyraźnej zgody i tworzy kopię zapasową. Instalator pobiera plasmoid-updater i weryfikuje SHA-256. Bazzite: otwórz AppImage przez Gear Lever z Bazaar, a następnie korzystaj wyłącznie z GUI. Aktualizowane są dodatki użytkownika, nie pakiety systemowe. Tylko bezpośredni .AppImage, bez ZIP/DEB/Flatpak.'
          fi
