name: Build and release AppImage

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  appimage:
    name: KDE Plasma AppImage x86_64
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6, Kirigami and build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl cmake ninja-build g++ git gh weston \
            rustc cargo patchelf file binutils \
            extra-cmake-modules qt6-base-dev qt6-declarative-dev \
            qt6-wayland qt6-base-dev-tools \
            libkirigami-dev libkf6qqc2desktopstyle-dev libkf6colorscheme-dev \
            kde-style-breeze-data \
            qml6-module-org-kde-kirigami qml6-module-org-kde-desktop \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts
      - name: Build and smoke-test AppImage
        run: |
          cargo test --manifest-path backend/Cargo.toml
          bash scripts/build-appimage.sh
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software APPIMAGE_EXTRACT_AND_RUN=1 \
            dist/Plasma-Addon-Manager-v0.4.5-x86_64.AppImage --self-test-desktop-icon
      - name: Test AppImage in a headless Wayland session
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --socket=pam-wayland --idle-time=0 --no-config \
            >"$XDG_RUNTIME_DIR/weston.log" 2>&1 &
          pam_weston_pid=$!
          trap 'kill "$pam_weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            test -S "$XDG_RUNTIME_DIR/pam-wayland" && break
            sleep 0.25
          done
          test -S "$XDG_RUNTIME_DIR/pam-wayland" || {
            cat "$XDG_RUNTIME_DIR/weston.log"
            exit 1
          }
          WAYLAND_DISPLAY=pam-wayland QT_QPA_PLATFORM=wayland QT_QUICK_BACKEND=software \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            dist/Plasma-Addon-Manager-v0.4.5-x86_64.AppImage --self-test
          WAYLAND_DISPLAY=pam-wayland QT_QPA_PLATFORM=wayland QT_QUICK_BACKEND=software \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            dist/Plasma-Addon-Manager-v0.4.5-x86_64.AppImage --self-test-session-log
      - name: Verify binary and checksum
        run: |
          test -s dist/Plasma-Addon-Manager-v0.4.5-x86_64.AppImage
          test -s build/package-appimage-AppDir/usr/share/icons/hicolor/scalable/apps/io.github.wolfgangxxiii.PlasmaAddonManager.svg
          test -s build/package-appimage-AppDir/usr/share/icons/hicolor/256x256/apps/io.github.wolfgangxxiii.PlasmaAddonManager.png
          sha256sum dist/Plasma-Addon-Manager-v0.4.5-x86_64.AppImage
      - name: Publish AppImage directly in Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.4.5-appimage-preview.12
          appimage=dist/Plasma-Addon-Manager-v0.4.5-x86_64.AppImage
          test -s "$appimage"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This preview was already published; leaving its download unchanged.'
          else
            gh release create "$tag" "$appimage" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'Plasma Addon Manager 0.4.5 — AppImage Preview 12 · Wybór motywu' \
              --notes 'W dolnej karcie pod wyborem języka dodano wybór motywu: Auto (zgodny z kolorami KDE Plasma), Jasny (Breeze Light) i Ciemny (Breeze Dark). Zmiana działa od razu w interfejsie Qt/Kirigami i jest zapamiętywana na następne uruchomienia. AppImage zawiera schematy Breeze Light/Dark, dzięki czemu nie zależy od ich obecności na komputerze. Powiększono kartę ustawień, zachowano niezmienne szerokości panelu i menu, przewijalne listy dodatków oraz dotychczasowe ikony.'
          fi
