<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Plasma Addon Manager</title>
  <desc id="description">Four modular add-on tiles surrounded by a circular update arrow on a blue-to-violet rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1689ef"/>
      <stop offset="0.54" stop-color="#4b65e5"/>
      <stop offset="1" stop-color="#8241cd"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a4fff0"/>
      <stop offset="1" stop-color="#49dbc9"/>
    </linearGradient>
  </defs>

  <!-- Transparent exterior corners for KDE launcher and taskbar usage. -->
  <rect x="7" y="7" width="114" height="114" rx="29" fill="url(#background)"/>
  <path d="M20 27Q25 17 39 16H91" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="3" stroke-linecap="round"/>

  <!-- Update loop intentionally stays open to read as an arrow, not a gear. -->
  <path d="M37 40 A37 37 0 1 1 35 86" fill="none" stroke="#ffffff" stroke-opacity=".92" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M37 98L34 85L47 86" fill="none" stroke="url(#mint)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A four-part add-on grid; final tile highlights newly updated content. -->
  <g fill="#ffffff">
    <rect x="45" y="45" width="17" height="17" rx="4.5"/>
    <rect x="66" y="45" width="17" height="17" rx="4.5"/>
    <rect x="45" y="66" width="17" height="17" rx="4.5"/>
  </g>
  <rect x="66" y="66" width="17" height="17" rx="4.5" fill="url(#mint)"/>
</svg>
